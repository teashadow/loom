[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.1.0"
description = "MAD pipeline runner — рама конвейера диагностических проб"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.0",
  "rich>=13.0",
]

[project.scripts]
loom = "loom_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
